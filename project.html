<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Слайдер изображений</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #fce4ec);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .slider {
            background-color: #ffffff;
            width: 420px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .slider img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #e0e0e0;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        button {
            padding: 10px 18px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background-color: #1976d2;
            color: #ffffff;
            transition: background-color 0.3s, transform 0.2s;
        }
        button:hover {
            background-color: #1565c0;
            transform: translateY(-2px);
        }
        button:active {
            transform: translateY(0);
        }
        .counter {
            margin-top: 12px;
            font-size: 15px;
            color: #555;
        }
    </style>
</head>
<body>
<div class="slider">
    <img id="sliderImage" src="" alt="Слайд">
    <div class="controls">
        <button id="prevBtn">← Назад</button>
        <button id="nextBtn">Вперед →</button>
    </div>
    <div class="counter" id="counter"></div>
</div>
<script>
    const images = [
        'https://picsum.photos/id/1015/600/400',
        'https://picsum.photos/id/1025/600/400',
        'https://picsum.photos/id/1035/600/400',
        'https://picsum.photos/id/1045/600/400',
        'https://picsum.photos/id/1055/600/400'
    ];
    let currentIndex = 0;
    const imageElement = document.getElementById('sliderImage');
    const counterElement = document.getElementById('counter');
    const nextBtn = document.getElementById('nextBtn');
    const prevBtn = document.getElementById('prevBtn');
    function updateSlider() {
        imageElement.src = images[currentIndex];
        counterElement.textContent = `Изображение ${currentIndex + 1} из ${images.length}`;
    }
    nextBtn.addEventListener('click', () => {
        currentIndex++;
        if (currentIndex >= images.length) {
            currentIndex = 0; // зацикливание
        }
        updateSlider();
    });
    prevBtn.addEventListener('click', () => {
        currentIndex--;
        if (currentIndex < 0) {
            currentIndex = images.length - 1; // зацикливание
        }
        updateSlider();
    });
    updateSlider();
</script>
</body>
</html>
